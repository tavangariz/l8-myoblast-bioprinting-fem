name: FEM + ML Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-analytical:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ---- No FEM or DOLFINx needed ----
      - name: Damage chain, analytical model, and the published surrogate
        run: |
          python scripts/l8_damage.py
          python scripts/analytical_model.py --validate
          python scripts/analytical_model.py --test
          python -c "import sys; sys.path.insert(0, 'scripts'); import l8_surrogate as S; S.fit_all()"

      - name: Upload figures (optional)
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: figures
          path: |
            results/figures/**/*.png
            results/figures/**/*.pdf
          if-no-files-found: ignore
